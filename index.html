<!DOCTYPE html>
<html lang="ko">
<head>  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백암고등학교 학사일정</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {ㅅ
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-3 sm:p-6 md:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden relative">
    
    <!-- Header Area -->
    <header class="relative bg-gradient-to-r from-blue-600 to-indigo-700 p-6 sm:p-8 text-white">
      <!-- Title -->
      <div class="text-center">
        <span class="inline-block px-3 py-1 bg-white/25 backdrop-blur-md rounded-full text-xs font-semibold tracking-wider uppercase mb-2">백암고등학교</span>
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight">학사일정</h1>
        <p class="text-blue-100 text-xs sm:text-sm mt-1">2026학년도 2학기 일정 안내 및 관리</p>
      </div>

      <!-- Color Legend (Top Right) -->
      <div class="mt-6 sm:mt-0 sm:absolute sm:top-6 sm:right-6 bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/20 text-xs shadow-inner">
        <div class="font-bold text-white/90 mb-1.5 pb-1 border-b border-white/20 hidden sm:block">색상 의미 범례</div>
        <div class="grid grid-cols-2 sm:grid-cols-1 gap-1.5">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-sm inline-block"></span>
            <span class="text-white font-medium">초록: 기념일</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-400 shadow-sm inline-block"></span>
            <span class="text-white font-medium">노란: 학교일정</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 shadow-sm inline-block"></span>
            <span class="text-white font-medium">빨간: 행사</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-sky-500 shadow-sm inline-block"></span>
            <span class="text-white font-medium">파란: 체험학습/수학여행</span>
          </div>
        </div>
      </div>
    </header>

    <main class="p-4 sm:p-6 md:p-8">
      
      <!-- Month Navigation and Add Button Bar -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-100 p-3 rounded-xl mb-6">
        <div class="flex items-center justify-between w-full sm:w-auto gap-3">
          <button id="prevMonth" class="flex items-center gap-1 px-3 py-2 bg-white rounded-lg shadow-sm text-slate-700 hover:bg-slate-50 font-medium text-sm transition-all hover:scale-105 active:scale-95">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
            <span class="hidden sm:inline">이전 달</span>
          </button>
          
          <div class="text-center flex items-center gap-2">
            <i data-lucide="calendar" class="w-5 h-5 text-indigo-600"></i>
            <h2 id="currentMonthYear" class="text-lg sm:text-xl font-bold text-slate-800 tracking-tight">2026년 10월</h2>
          </div>

          <button id="nextMonth" class="flex items-center gap-1 px-3 py-2 bg-white rounded-lg shadow-sm text-slate-700 hover:bg-slate-50 font-medium text-sm transition-all hover:scale-105 active:scale-95">
            <span class="hidden sm:inline">다음 달</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Add Event Button -->
        <button onclick="openModal()" class="w-full sm:w-auto flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600 text-white rounded-lg shadow-md hover:bg-indigo-700 font-semibold text-sm transition-all hover:scale-105 active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>일정 등록 / 관리</span>
        </button>
      </div>

      <!-- Calendar Grid Container -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-8">
        <!-- Days of Week Header -->
        <div class="grid grid-cols-7 bg-slate-50 border-b border-slate-200 text-center font-bold text-xs sm:text-sm py-2.5">
          <div class="text-rose-500">일</div>
          <div class="text-slate-700">월</div>
          <div class="text-slate-700">화</div>
          <div class="text-slate-700">수</div>
          <div class="text-slate-700">목</div>
          <div class="text-slate-700">금</div>
          <div class="text-sky-600">토</div>
        </div>

        <!-- Dynamic Calendar Grid -->
        <div id="calendarGrid" class="grid grid-cols-7 divide-x divide-y divide-slate-100 min-h-[420px]">
          <!-- Calendar Days inserted via JS -->
        </div>
      </div>

      <section class="bg-slate-50 rounded-xl p-5 border border-slate-200/80">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <div class="p-2 bg-indigo-100 rounded-lg text-indigo-600">
              <i data-lucide="clock" class="w-5 h-5"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800">가까운 일정 모아보기</h3>
          </div>
          <span class="text-xs text-slate-500 font-medium bg-white px-3 py-1 rounded-full border border-slate-200 shadow-2xs">D-Day 순 정렬</span>
        </div>

        <div id="upcomingEventsList" class="space-y-2.5">
          <!-- Upcoming events injected via JS -->
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-100 border-t border-slate-200 p-4 text-center text-xs text-slate-500">
      백암고등학교 학급 홈페이지 &bull; 학사일정안내
    </footer>

  </div>

  <div id="eventModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 transform transition-all">
      
      <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
        <h3 id="modalTitle" class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="calendar-plus" class="w-5 h-5 text-indigo-600"></i>
          <span>새 학사일정 등록</span>
        </h3>
        <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="eventForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="eventId">

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">일정 제목</label>
          <input type="text" id="eventTitleInput" required placeholder="예: 전국연합학력평가, 백암고 축제 등" 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">날짜 선택</label>
            <input type="date" id="eventDateInput" required 
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">일정 분류 (색상)</label>
            <select id="eventTypeInput" required
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
              <option value="green">초록색 (기념일)</option>
              <option value="yellow">노란색 (학교일정)</option>
              <option value="red">빨간색 (행사)</option>
              <option value="blue">파란색 (체험학습/수학여행)</option>
            </select>
          </div>
        </div>

        <div class="pt-2 flex items-center justify-between gap-3">
          <button type="button" id="deleteEventBtn" onclick="deleteCurrentEvent()" class="hidden px-4 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 font-semibold rounded-xl text-sm transition-all">
            삭제하기
          </button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl text-sm transition-all">
              취소
            </button>
            <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-indigo-200 transition-all">
              저장하기
            </button>
          </div>
        </div>
      </form>

      <!-- Event management list inside modal -->
      <div class="mt-6 pt-4 border-t border-slate-100">
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">등록된 일정 목록 (수정 및 삭제)</h4>
        <div id="modalEventList" class="max-h-40 overflow-y-auto space-y-1.5 pr-1">
          <!-- Populated via JS -->
        </div>
      </div>

    </div>
  </div>

  <script>
    // Initial Default Data based on Baekam High School 2nd Semester Academic Calendar
    const defaultAcademicEvents = [
      { id: '1', date: '2026-08-17', title: '대체휴일', type: 'green' },
      { id: '2', date: '2026-08-18', title: '2학기 개학식', type: 'yellow' },
      { id: '3', date: '2026-09-02', title: '전국연합학력평가(1,2,3)', type: 'blue' },
      { id: '4', date: '2026-09-22', title: '금요일 수업 실시', type: 'yellow' },
      { id: '5', date: '2026-09-24', title: '추석 연휴', type: 'green' },
      { id: '6', date: '2026-09-25', title: '추석', type: 'green' },
      { id: '7', date: '2026-10-05', title: '대체휴일', type: 'green' },
      { id: '8', date: '2026-10-09', title: '한글날', type: 'green' },
      { id: '9', date: '2026-10-13', title: '1차 지필평가 (1일차)', type: 'blue' },
      { id: '10', date: '2026-10-14', title: '1차 지필평가 (2일차)', type: 'blue' },
      { id: '11', date: '2026-10-15', title: '1차 지필평가 (3일차)', type: 'blue' },
      { id: '12', date: '2026-10-16', title: '1차 지필평가 (4일차)', type: 'blue' },
      { id: '13', date: '2026-10-20', title: '전국연합학력평가(1,2,3)', type: 'blue' },
      { id: '14', date: '2026-11-19', title: '수능일 / 재량휴업일', type: 'green' },
      { id: '15', date: '2026-11-20', title: '재량휴업일', type: 'green' },
      { id: '16', date: '2026-12-15', title: '2차 지필평가 (1일차)', type: 'blue' },
      { id: '17', date: '2026-12-16', title: '2차 지필평가 (2일차)', type: 'blue' },
      { id: '18', date: '2026-12-17', title: '2차 지필평가 (3일차)', type: 'blue' },
      { id: '19', date: '2026-12-18', title: '2차 지필평가 (4일차)', type: 'blue' },
      { id: '20', date: '2026-12-25', title: '성탄절', type: 'green' },
      { id: '21', date: '2026-12-30', title: '백암고 축제', type: 'red' },
      { id: '22', date: '2026-12-30', title: '금요일 수업 실시', type: 'yellow' },
      { id: '23', date: '2027-01-01', title: '신정', type: 'green' },
      { id: '24', date: '2027-01-07', title: '졸업식 및 종업식', type: 'red' }
    ];

    let academicEvents = JSON.parse(localStorage.getItem('baekam_academic_events')) || defaultAcademicEvents;

    const typeStyles = {
      green: { badgeBg: 'bg-emerald-500', lightBg: 'bg-emerald-50 text-emerald-700 border-emerald-200', text: '기념일' },
      yellow: { badgeBg: 'bg-amber-400', lightBg: 'bg-amber-50 text-amber-800 border-amber-200', text: '학교일정' },
      red: { badgeBg: 'bg-rose-500', lightBg: 'bg-rose-50 text-rose-700 border-rose-200', text: '행사' },
      blue: { badgeBg: 'bg-sky-500', lightBg: 'bg-sky-50 text-sky-700 border-sky-200', text: '체험학습/수학여행' }
    };

    let currentYear = 2026;
    let currentMonth = 10;
    const today = new Date('2026-10-12');

    function saveEvents() {
      localStorage.setItem('baekam_academic_events', JSON.stringify(academicEvents));
    }

    function renderCalendar(year, month) {
      const calendarGrid = document.getElementById('calendarGrid');
      const currentMonthYear = document.getElementById('currentMonthYear');

      currentMonthYear.textContent = `${year}년 ${month}월`;
      calendarGrid.innerHTML = '';

      const firstDay = new Date(year, month - 1, 1).getDay();
      const lastDate = new Date(year, month, 0).getDate();
      const prevMonthLastDate = new Date(year, month - 1, 0).getDate();

      for (let i = firstDay - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDate - i;
        calendarGrid.appendChild(createCell(dayNum, true));
      }

      for (let date = 1; date <= lastDate; date++) {
        const formattedDate = `${year}-${String(month).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        const dayOfWeek = new Date(year, month - 1, date).getDay();
        const events = academicEvents.filter(e => e.date === formattedDate);
        
        calendarGrid.appendChild(createCell(date, false, dayOfWeek, events, formattedDate));
      }

      const totalCells = firstDay + lastDate;
      const remainingCells = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= remainingCells; i++) {
        calendarGrid.appendChild(createCell(i, true));
      }

      lucide.createIcons();
    }

    function createCell(dateNum, isOtherMonth, dayOfWeek = null, events = [], dateStr = '') {
      const cell = document.createElement('div');
      cell.className = `p-1.5 sm:p-2 min-h-[90px] sm:min-h-[110px] flex flex-col justify-start transition-colors ${
        isOtherMonth ? 'bg-slate-50/50 text-slate-300' : 'bg-white hover:bg-slate-50/60'
      }`;

      if (!isOtherMonth) {
        const header = document.createElement('div');
        header.className = 'flex items-center justify-between mb-1';

        const numSpan = document.createElement('span');
        numSpan.className = 'text-xs sm:text-sm font-semibold inline-block w-5 h-5 leading-5 text-center rounded-full';
        
        if (dayOfWeek === 0) numSpan.classList.add('text-rose-500');
        else if (dayOfWeek === 6) numSpan.classList.add('text-sky-600');
        else numSpan.classList.add('text-slate-700');

        if (dateStr === '2026-10-12') {
          numSpan.classList.add('bg-indigo-600', 'text-white', 'shadow-xs');
        }

        numSpan.textContent = dateNum;
        header.appendChild(numSpan);
        cell.appendChild(header);

        events.forEach(evt => {
          const eventTag = document.createElement('div');
          const style = typeStyles[evt.type] || typeStyles['green'];
          eventTag.className = `${style.badgeBg} text-white text-[10px] sm:text-xs font-medium px-1.5 py-0.5 rounded shadow-2xs mb-1 truncate cursor-pointer hover:opacity-80 transition-opacity`;
          eventTag.title = `${evt.title} (클릭하여 수정/삭제)`;
          eventTag.textContent = evt.title;
          
          eventTag.onclick = (e) => {
            e.stopPropagation();
            openModal(evt.id);
          };

          cell.appendChild(eventTag);
        });
      } else {
        const numSpan = document.createElement('span');
        numSpan.className = 'text-xs font-medium text-slate-300 p-0.5';
        numSpan.textContent = dateNum;
        cell.appendChild(numSpan);
      }

      return cell;
    }

    function renderUpcomingEvents() {
      const listContainer = document.getElementById('upcomingEventsList');
      listContainer.innerHTML = '';

      const sortedEvents = academicEvents
        .map(evt => {
          const evtDate = new Date(evt.date);
          const diffTime = evtDate - today;
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          return { ...evt, diffDays };
        })
        .filter(evt => evt.diffDays >= 0)
        .sort((a, b) => a.diffDays - b.diffDays)
        .slice(0, 5);

      if (sortedEvents.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">예정된 일정이 없습니다.</div>`;
        return;
      }

      sortedEvents.forEach(evt => {
        const style = typeStyles[evt.type] || typeStyles['green'];
        const dateObj = new Date(evt.date);
        const monthDayStr = `${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일`;
        let dDayText = evt.diffDays === 0 ? 'D-Day' : `D-${evt.diffDays}`;

        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-3 bg-white rounded-xl border border-slate-200/80 shadow-2xs hover:border-indigo-300 transition-all cursor-pointer';
        item.onclick = () => openModal(evt.id);

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="px-2.5 py-1 text-xs font-extrabold rounded-md ${style.badgeBg} text-white shadow-2xs">
              ${dDayText}
            </span>
            <div>
              <div class="font-bold text-slate-800 text-sm sm:text-base">${evt.title}</div>
              <div class="text-xs text-slate-500 font-medium">${monthDayStr}</div>
            </div>
          </div>
          <span class="text-xs px-2.5 py-1 rounded-full border ${style.lightBg} font-semibold">
            ${style.text}
          </span>
        `;
        listContainer.appendChild(item);
      });
    }

    function openModal(editId = null) {
      const modal = document.getElementById('eventModal');
      const modalTitle = document.getElementById('modalTitle');
      const deleteBtn = document.getElementById('deleteEventBtn');
      const form = document.getElementById('eventForm');
      
      form.reset();
      document.getElementById('eventId').value = '';

      if (editId) {
        const eventToEdit = academicEvents.find(e => e.id === editId);
        if (eventToEdit) {
          modalTitle.innerHTML = `<i data-lucide="calendar" class="w-5 h-5 text-indigo-600"></i><span>학사일정 수정 및 삭제</span>`;
          document.getElementById('eventId').value = eventToEdit.id;
          document.getElementById('eventTitleInput').value = eventToEdit.title;
          document.getElementById('eventDateInput').value = eventToEdit.date;
          document.getElementById('eventTypeInput').value = eventToEdit.type;
          deleteBtn.classList.remove('hidden');
        }
      } else {
        modalTitle.innerHTML = `<i data-lucide="calendar-plus" class="w-5 h-5 text-indigo-600"></i><span>새 학사일정 등록</span>`;
        document.getElementById('eventDateInput').value = '2026-10-12';
        deleteBtn.classList.add('hidden');
      }

      renderModalEventList();
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('eventModal').classList.add('hidden');
    }

    function renderModalEventList() {
      const container = document.getElementById('modalEventList');
      container.innerHTML = '';

      if (academicEvents.length === 0) {
        container.innerHTML = `<div class="text-xs text-slate-400 text-center py-2">등록된 일정이 없습니다.</div>`;
        return;
      }

      const sorted = [...academicEvents].sort((a, b) => new Date(a.date) - new Date(b.date));

      sorted.forEach(evt => {
        const style = typeStyles[evt.type] || typeStyles['green'];
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-2 bg-slate-50 rounded-lg border border-slate-200 text-xs';
        
        row.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <span class="w-2 h-2 rounded-full ${style.badgeBg}"></span>
            <span class="font-bold text-slate-700">${evt.date}</span>
            <span class="text-slate-600 truncate">${evt.title}</span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button type="button" onclick="openModal('${evt.id}')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 font-medium text-slate-700">수정</button>
            <button type="button" onclick="deleteSpecificEvent('${evt.id}')" class="px-2 py-1 bg-rose-50 border border-rose-200 text-rose-600 rounded hover:bg-rose-100 font-medium">삭제</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('eventId').value;
      const title = document.getElementById('eventTitleInput').value.trim();
      const date = document.getElementById('eventDateInput').value;
      const type = document.getElementById('eventTypeInput').value;

      if (!title || !date) return;

      if (id) {
        academicEvents = academicEvents.map(e => e.id === id ? { ...e, title, date, type } : e);
      } else {
        const newEvt = {
          id: Date.now().toString(),
          title,
          date,
          type
        };
        academicEvents.push(newEvt);
      }

      saveEvents();
      renderCalendar(currentYear, currentMonth);
      renderUpcomingEvents();
      closeModal();
    }

    function deleteCurrentEvent() {
      const id = document.getElementById('eventId').value;
      if (id) {
        deleteSpecificEvent(id);
      }
    }

    function deleteSpecificEvent(id) {
      // alert() 대신 커스텀 메시지 표시를 활용하고 즉시 배열에서 필터링 후 저장
      academicEvents = academicEvents.filter(e => e.id !== id);
      saveEvents();
      renderCalendar(currentYear, currentMonth);
      renderUpcomingEvents();
      renderModalEventList();
      closeModal();
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
      }
      renderCalendar(currentYear, currentMonth);
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
      }
      renderCalendar(currentYear, currentMonth);
    });

    window.onload = function() {
      renderCalendar(currentYear, currentMonth);
      renderUpcomingEvents();
      lucide.createIcons();
    };
  </script>
</body>
</html>
